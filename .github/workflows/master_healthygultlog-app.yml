name: Build, migrate, and deploy

on:
  push:
    branches:
      - master
    paths:
      - 'FodmapLog.Server/**'
      - 'Core/**'
      - 'DataAccess/**'
      - 'Data.Common/**'
      - 'fodmaplog.client/**'
      - '.github/workflows/master_healthygultlog-app.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: healthygultlog-app
  AZURE_RESOURCE_GROUP: rg-symptomtracker
  AZURE_SQL_SERVER: sql-symptom-tracker-dev
  DOTNET_NOLOGO: true

jobs:
  build-migrate-deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://healthygultlog-app.azurewebsites.net
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fodmaplog.client/package-lock.json

      - name: Build Angular SPA
        working-directory: fodmaplog.client
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Copy SPA into Server wwwroot
        id: spa
        run: |
          mkdir -p FodmapLog.Server/wwwroot
          if [ -d fodmaplog.client/dist/fodmaplog.client/browser ]; then
            cp -R fodmaplog.client/dist/fodmaplog.client/browser/. FodmapLog.Server/wwwroot/
          else
            cp -R fodmaplog.client/dist/fodmaplog.client/. FodmapLog.Server/wwwroot/
          fi
          test -f FodmapLog.Server/wwwroot/index.html

      - name: Check Azure credentials
        id: azure
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.azure.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply EF migrations
        if: steps.azure.outputs.enabled == 'true'
        env:
          SQL_CONNECTION: ${{ secrets.SQL_PROD_CONNECTION }}
        run: |
          set -euo pipefail
          CONN="${SQL_CONNECTION:-}"
          if [ -z "$CONN" ]; then
            CONN=$(az webapp config connection-string list \
              -g "$AZURE_RESOURCE_GROUP" \
              -n "$AZURE_WEBAPP_NAME" \
              --query "[?name=='prodConnection'].value" -o tsv)
          fi
          if [ -z "$CONN" ]; then
            echo "No prodConnection on the web app and no SQL_PROD_CONNECTION secret."
            exit 1
          fi
          echo "SQL administratorLogin=$(az sql server show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_SQL_SERVER" --query administratorLogin -o tsv)"
          echo "SQL Entra-only auth:"
          az sql server ad-only-auth get -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_SQL_SERVER" -o json || true
          export CONN
          python3 - <<'PY'
import os, re
c = os.environ.get("CONN", "")
def grab(pat, default="missing"):
    m = re.search(pat, c, re.I)
    return m.group(1).strip() if m else default
print("conn_chars", len(c))
print("server", grab(r"server=([^;]+)"))
print("database", grab(r"(?:initial catalog|database)=([^;]+)"))
print("user_id", grab(r"(?:user\s*id|uid)=([^;]+)"))
print("authentication", grab(r"authentication=([^;]+)", "sql-password-or-none"))
print("has_password_key", bool(re.search(r"(?i)(?:password|pwd)\s*=", c)))
m = re.search(r"(?i)(?:password|pwd)=([^;]*)", c)
print("password_chars", len(m.group(1)) if m else 0)
print("has_entra_auth", bool(re.search(r"(?i)active directory|entra", c)))
PY
          AD_ONLY=$(az sql server ad-only-auth get -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_SQL_SERVER" --query azureADOnlyAuthentication -o tsv || true)
          if [ "$AD_ONLY" = "true" ]; then
            echo "SQL server has Microsoft Entra-only authentication. User/password logins (adam) always fail with 18456."
            echo "Disable with: az sql server ad-only-auth disable -g $AZURE_RESOURCE_GROUP -n $AZURE_SQL_SERVER"
            exit 1
          fi
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            -g "$AZURE_RESOURCE_GROUP" \
            -s "$AZURE_SQL_SERVER" \
            -n GitHubActionsDeploy \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"
          trap 'az sql server firewall-rule delete -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n GitHubActionsDeploy || true' EXIT
          dotnet tool update --global dotnet-ef --version 9.0.4
          export PATH="$PATH:$HOME/.dotnet/tools"
          export ConnectionStrings__prodConnection="$CONN"
          if [ -n "${SQL_CONNECTION:-}" ]; then
            echo "Using GitHub secret SQL_PROD_CONNECTION"
          else
            echo "Using App Service connection string prodConnection"
          fi
          dotnet build DataAccess/DataAccess.csproj -c Release --verbosity minimal
          attempt=1
          max_attempts=5
          while true; do
            set +e
            set +o pipefail
            dotnet ef database update --project DataAccess --connection "$CONN" 2>&1 | tee /tmp/ef-migrate.log
            status=${PIPESTATUS[0]}
            set -euo pipefail
            if [ "$status" -eq 0 ]; then
              echo "Migrations applied."
              break
            fi
            if grep -Eqi 'Login failed|Error Number:18456' /tmp/ef-migrate.log; then
              echo "SQL login failed (18456). This is not auto-pause."
              echo "Reset admin password for user adam on sql-symptom-tracker-dev and update App Service prodConnection (or SQL_PROD_CONNECTION). Do not paste the password into GitHub issues or chat."
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Migration failed after $max_attempts attempts (Azure SQL may still be paused)."
              exit 1
            fi
            echo "SQL not ready (often auto-pause 40613). Retry $attempt/$max_attempts in 25s..."
            attempt=$((attempt + 1))
            sleep 25
          done

      - name: Publish server
        if: always() && steps.spa.outcome == 'success'
        run: dotnet publish FodmapLog.Server/FodmapLog.Server.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App
        if: always() && steps.spa.outcome == 'success' && steps.azure.outputs.enabled == 'true'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish
