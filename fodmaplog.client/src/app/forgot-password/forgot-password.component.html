<div class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()">
    <h1>{{ 'forgot.title' | translate }}</h1>
    <p class="auth-hint">{{ 'forgot.hint' | translate }}</p>
    <label class="form-label" for="email">{{ 'forgot.email' | translate }}</label>
    <input class="form-control" id="email" name="email" type="email" [(ngModel)]="email"
      required autocomplete="email" [placeholder]="'forgot.emailPlaceholder' | translate">
    <div class="alert alert-danger p-2 mt-3" [class.invisible]="!errorMessage" role="alert">{{ errorMessage }}</div>
    <div class="alert alert-success p-2" [class.invisible]="!successMessage" role="alert">{{ successMessage }}</div>
    <button class="btn btn-primary w-100 mt-2" type="submit" [disabled]="isSubmitting">
      {{ (isSubmitting ? 'forgot.submitting' : 'forgot.submit') | translate }}
    </button>
    <button *ngIf="successMessage" type="button" class="btn btn-outline-secondary w-100 mt-2" (click)="goReset()">
      {{ 'forgot.haveCode' | translate }}
    </button>
    <div class="text-center mt-3">
      <a routerLink="/login">{{ 'forgot.backLogin' | translate }}</a>
    </div>
  </form>
</div>
