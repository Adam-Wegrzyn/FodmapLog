<div class="auth-shell">
  <form class="auth-card" (ngSubmit)="login()">
    <div class="auth-brand">
      <img src="assets/brand/mova-lockup.svg" width="220" height="59" alt="Mova" />
      <p class="auth-sub">{{ 'login.tagline' | translate }}</p>
    </div>
    <h2 class="auth-title mb-3">{{ 'login.title' | translate }}</h2>
    <div class="mb-3">
      <label class="form-label" for="email">{{ 'login.email' | translate }}</label>
      <input class="form-control" [(ngModel)]="email" type="email" id="email" name="email" required autocomplete="email"
        [placeholder]="'login.emailPlaceholder' | translate">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">{{ 'login.password' | translate }}</label>
      <input class="form-control" [(ngModel)]="password" type="password" id="password" name="password" required autocomplete="current-password"
        [placeholder]="'login.passwordPlaceholder' | translate">
    </div>
    <div class="alert alert-danger p-2" [class.invisible]="!errorMessage" [style.minHeight.px]="38" role="alert">
      {{errorMessage}}
    </div>
    <button class="btn btn-success w-100 mt-3" type="submit">{{ 'login.submit' | translate }}</button>
    <div>
      <button class="btn btn-outline-secondary w-100 mt-2" (click)="loginWithGoogle()" type="button">
        <i class="fa-brands fa-google"></i> {{ 'login.google' | translate }}
      </button>
    </div>
    <div class="text-center mt-2">
      <a routerLink="/forgot-password" class="text-decoration-none">{{ 'login.forgot' | translate }}</a>
    </div>
    <div class="text-center mt-3">
      <span class="text-muted">{{ 'login.noAccount' | translate }}</span>
      <a routerLink="/signup" class="ms-1 text-decoration-none">{{ 'login.signUpLink' | translate }}</a>
    </div>
  </form>
</div>
