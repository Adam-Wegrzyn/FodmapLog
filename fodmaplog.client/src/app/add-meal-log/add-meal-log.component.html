<div class="editor-page editor-page--meal">
  <header class="editor-topbar">
    <button type="button" class="btn-ghost" (click)="cancel()" [routerLink]="['/daily-log', currDate]">
      Cancel
    </button>
    <div class="editor-title-wrap">
      <p class="editor-kicker">Manual entry</p>
      <h1 class="editor-title">Meal</h1>
    </div>
    <button type="button" class="btn-primary" (click)="SaveMealLog()" [disabled]="productQuantityArr.length === 0">
      Save
    </button>
  </header>

  <section class="editor-card">
    <h2 class="card-label">When</h2>
    <app-date-time-input
      [(date)]="currDate"
      [(time)]="currTime"
      (dateTimeChange)="onDateTimeChanged($event)">
    </app-date-time-input>
  </section>

  <section class="editor-card" *ngIf="productQuantityArr.length > 0">
    <div class="card-label-row">
      <h2 class="card-label">Foods</h2>
      <span class="card-count">{{ productQuantityArr.length }}</span>
    </div>
    <ul class="food-cards">
      <li class="food-card" *ngFor="let p of productQuantityArr.controls; let i = index">
        <div>
          <p class="food-name">{{ p.value.product.name }}</p>
          <p class="food-amount">{{ p.value.quantity }} {{ p.value.unit?.name }}</p>
        </div>
        <button type="button" class="btn-icon-danger" (click)="DeleteProduct(i)" aria-label="Remove food">
          &times;
        </button>
      </li>
    </ul>
  </section>

  <section class="editor-card composer-card">
    <h2 class="card-label">Add food</h2>
    <div class="composer-row">
      <input
        class="composer-input"
        type="text"
        [(ngModel)]="name"
        placeholder="e.g. oatmeal, banana"
        (keydown.enter)="$event.preventDefault(); openComposer()">
      <button type="button" class="btn-secondary composer-add" (click)="openComposer()" [disabled]="!name?.trim()">
        Add
      </button>
    </div>
    <p class="card-hint">Type a food, then set amount</p>
  </section>

  <div class="composer-layer" *ngIf="showComposer" (click)="closeComposer()">
    <div class="composer-sheet" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      <header class="composer-sheet-head">
        <div>
          <p class="composer-sheet-kicker">Amount</p>
          <h2>{{ name }}</h2>
        </div>
        <button type="button" class="btn-icon-danger" (click)="closeComposer()" aria-label="Close">&times;</button>
      </header>
      <div class="composer-sheet-body">
        <label class="field">
          <span>Quantity</span>
          <input type="number" min="0" step="any" [(ngModel)]="quantityInput" class="field-control">
        </label>
        <label class="field">
          <span>Unit</span>
          <select [(ngModel)]="selectedUnit" class="field-control">
            <option *ngFor="let unit of units" [ngValue]="unit">{{ unit.name }}</option>
          </select>
        </label>
      </div>
      <footer class="composer-sheet-foot">
        <button type="button" class="btn-ghost" (click)="closeComposer()">Cancel</button>
        <button type="button" class="btn-primary" (click)="confirmAddProduct()">Add food</button>
      </footer>
    </div>
  </div>

  <p class="editor-foot-hint" *ngIf="productQuantityArr.length === 0">
    Add at least one food to save this meal.
  </p>
</div>
