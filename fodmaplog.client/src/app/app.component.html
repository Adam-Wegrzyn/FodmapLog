<ng-container *ngIf="isLoggedIn()">
  <header class="app-topbar d-none d-lg-flex">
    <a class="brand" routerLink="/daily-log">HealthyGut<span>Log</span></a>
    <nav class="top-nav" aria-label="Main">
      <a routerLink="/daily-log" routerLinkActive="is-active">Today</a>
      <div class="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
          Add
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" routerLink="/add-meal-log">Meal</a></li>
          <li><a class="dropdown-item" routerLink="/add-symptoms-log">Symptoms</a></li>
        </ul>
      </div>
      <div class="nav-dropdown">
        <button type="button" class="nav-dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
          {{ username || 'Account' }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button type="button" class="dropdown-item" (click)="logout()">Log out</button></li>
        </ul>
      </div>
    </nav>
  </header>

  <nav class="app-bottombar d-flex d-lg-none" aria-label="Mobile">
    <a class="bottom-link" routerLink="/daily-log" routerLinkActive="is-active">
      <i class="fas fa-calendar-day" aria-hidden="true"></i>
      <span>Today</span>
    </a>
    <button type="button" class="bottom-link" (click)="logout()">
      <i class="fas fa-user" aria-hidden="true"></i>
      <span>Account</span>
    </button>
  </nav>
</ng-container>

<main class="app-shell" [class.app-shell--authed]="isLoggedIn()">
  <router-outlet></router-outlet>
</main>
