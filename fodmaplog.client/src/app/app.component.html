<div *ngIf="!loggedIn" class="lang-switch" role="group" [attr.aria-label]="'nav.language' | translate">
  <button type="button" class="lang-btn" [class.is-active]="language.currentLang === 'en'" (click)="setLang('en')">EN</button>
  <button type="button" class="lang-btn" [class.is-active]="language.currentLang === 'pl'" (click)="setLang('pl')">PL</button>
</div>

<header *ngIf="loggedIn" class="app-topbar">
  <a class="brand" routerLink="/daily-log" aria-label="Mova">
    <img class="brand-mark" src="assets/brand/mova-mark.svg" width="28" height="28" alt="" />
    <span class="brand-name">Mova</span>
  </a>
  <nav class="top-nav" [attr.aria-label]="'nav.main' | translate">
    <a class="top-link top-link--wide" routerLink="/daily-log" routerLinkActive="is-active">{{ 'nav.today' | translate }}</a>
    <a class="top-link top-link--wide" routerLink="/export-logs" routerLinkActive="is-active">{{ 'nav.export' | translate }}</a>
    <a class="top-link" routerLink="/account" routerLinkActive="is-active" [attr.title]="username">{{ 'nav.account' | translate }}</a>
    <button type="button" class="top-link top-link--wide top-link--button" (click)="logout()">{{ 'nav.logOut' | translate }}</button>
  </nav>
  <div class="lang-switch lang-switch--bar" role="group" [attr.aria-label]="'nav.language' | translate">
    <button type="button" class="lang-btn" [class.is-active]="language.currentLang === 'en'" (click)="setLang('en')">EN</button>
    <button type="button" class="lang-btn" [class.is-active]="language.currentLang === 'pl'" (click)="setLang('pl')">PL</button>
  </div>
</header>

<nav *ngIf="loggedIn" class="app-bottombar" [attr.aria-label]="'nav.mobile' | translate">
  <a class="bottom-link" routerLink="/daily-log" routerLinkActive="is-active">
    <i class="fas fa-calendar-day" aria-hidden="true"></i>
    <span>{{ 'nav.today' | translate }}</span>
  </a>
  <a class="bottom-link" routerLink="/export-logs" routerLinkActive="is-active">
    <i class="fas fa-file-export" aria-hidden="true"></i>
    <span>{{ 'nav.export' | translate }}</span>
  </a>
  <a class="bottom-link" routerLink="/account" routerLinkActive="is-active">
    <i class="fas fa-user" aria-hidden="true"></i>
    <span>{{ 'nav.account' | translate }}</span>
  </a>
</nav>

<main class="app-shell" [class.app-shell--authed]="loggedIn">
  <router-outlet></router-outlet>
</main>
