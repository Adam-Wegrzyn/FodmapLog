<div class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()">
    <h1>{{ 'reset.title' | translate }}</h1>
    <p class="auth-hint">{{ 'reset.hint' | translate }}</p>

    <label class="form-label" for="email">{{ 'reset.email' | translate }}</label>
    <input class="form-control mb-2" id="email" name="email" type="email" [(ngModel)]="email"
      required autocomplete="email">

    <label class="form-label" for="code">{{ 'reset.code' | translate }}</label>
    <input class="form-control mb-2" id="code" name="code" type="text" [(ngModel)]="resetCode" required>

    <label class="form-label" for="password">{{ 'reset.password' | translate }}</label>
    <input class="form-control mb-2" id="password" name="password" type="password" [(ngModel)]="newPassword"
      required autocomplete="new-password">

    <label class="form-label" for="confirm">{{ 'reset.confirmPassword' | translate }}</label>
    <input class="form-control" id="confirm" name="confirm" type="password" [(ngModel)]="confirmPassword"
      required autocomplete="new-password">

    <div class="alert alert-danger p-2 mt-3" [class.invisible]="!errorMessage" role="alert">{{ errorMessage }}</div>
    <div class="alert alert-success p-2" [class.invisible]="!successMessage" role="alert">{{ successMessage }}</div>

    <button class="btn btn-primary w-100 mt-2" type="submit" [disabled]="isSubmitting">
      {{ (isSubmitting ? 'reset.submitting' : 'reset.submit') | translate }}
    </button>
    <div class="text-center mt-3">
      <a routerLink="/login">{{ 'reset.backLogin' | translate }}</a>
    </div>
  </form>
</div>
