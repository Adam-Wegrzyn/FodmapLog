<div class="auth-shell">
  <form class="auth-card" (ngSubmit)="signup()">
    <div class="auth-brand">
      <img src="assets/brand/mova-lockup.svg" width="220" height="59" alt="Mova" />
    </div>
    <h2 class="auth-title mb-3">{{ 'signup.title' | translate }}</h2>
    <div class="mb-3">
      <label class="form-label" for="email">{{ 'signup.email' | translate }}</label>
      <input class="form-control" [(ngModel)]="email" type="email" id="email" name="email" required autocomplete="email"
        [placeholder]="'signup.emailPlaceholder' | translate">
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">{{ 'signup.password' | translate }}</label>
      <input class="form-control" [(ngModel)]="password" type="password" id="password" name="password" required autocomplete="new-password"
        [placeholder]="'signup.passwordPlaceholder' | translate">
    </div>
    <div class="mb-3">
      <label class="form-label" for="confirmPassword">{{ 'signup.confirmPassword' | translate }}</label>
      <input class="form-control" [(ngModel)]="confirmPassword" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password"
        [placeholder]="'signup.confirmPlaceholder' | translate">
    </div>
    <div class="alert alert-danger p-2" [class.invisible]="!errorMessage && !errorMessages.length" [style.minHeight.px]="38" role="alert">
      <div *ngIf="errorMessage">{{ errorMessage }}</div>
      <div *ngFor="let e of errorMessages">{{ e }}</div>
    </div>
    <div class="alert alert-success p-2" [class.invisible]="!successMessage" [style.minHeight.px]="38" role="alert">
      {{successMessage}}
    </div>
    <button type="submit" class="btn btn-success w-100 mt-3" [disabled]="isSubmitting">
      {{ (isSubmitting ? 'signup.submitting' : 'signup.submit') | translate }}
    </button>
    <div class="text-center mt-3">
      <span class="text-muted">{{ 'signup.haveAccount' | translate }}</span>
      <a routerLink="/login" class="ms-1 text-decoration-none">{{ 'signup.logInLink' | translate }}</a>
    </div>
  </form>
</div>
